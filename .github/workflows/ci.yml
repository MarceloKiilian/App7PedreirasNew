name: CI - App 7 Pedreiras

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"
      - develop
      - release
      - main
  pull_request:
    branches:
      - develop
      - release
      - main

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

  create-pull-request:
    name: Abrir próximo PR do fluxo
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/fix/') ||
        startsWith(github.ref, 'refs/heads/chore/') ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/release'
      )
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar e abrir Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          case "$HEAD_BRANCH" in
            develop)
              BASE_BRANCH="release"
              PR_TITLE="Promover develop para release"
              ;;
            release)
              BASE_BRANCH="main"
              PR_TITLE="Promover release para main"
              ;;
            *)
              BASE_BRANCH="develop"
              PR_TITLE="$HEAD_BRANCH"
              ;;
          esac

          OPEN_PRS=$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_PRS" -eq 0 ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "$PR_TITLE" \
              --body "Pull Request criado automaticamente após a validação do CI."
          else
            echo "Já existe um Pull Request aberto de $HEAD_BRANCH para $BASE_BRANCH."
          fi
