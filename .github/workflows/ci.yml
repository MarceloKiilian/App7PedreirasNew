name: CI - App 7 Pedreiras

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"
      - develop
      - release
      - main
  pull_request:
    branches:
      - develop
      - release
      - main

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

  create-pull-request:
    name: Abrir próximo PR do fluxo
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/fix/') ||
        startsWith(github.ref, 'refs/heads/chore/') ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/release'
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar e abrir Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          case "$HEAD_BRANCH" in
            develop)
              BASE_BRANCH="release"
              OPEN_RELEASE_PRS=$(gh pr list \
                --base "$BASE_BRANCH" \
                --state open \
                --json headRefName \
                --jq '[.[] | select(.headRefName | startswith("release/v"))] | length')

              if [ "$OPEN_RELEASE_PRS" -gt 0 ]; then
                echo "Já existe um Pull Request de versão aberto para release."
                exit 0
              fi

              git fetch origin release
              CURRENT_VERSION=$(git show origin/release:package.json | node -e '
                let input = "";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => console.log(JSON.parse(input).version));
              ')
              NEXT_VERSION=$(node -e '
                const parts = process.argv[1].split(".").map(Number);
                if (parts.length !== 3 || parts.some(Number.isNaN)) {
                  throw new Error("Versão atual inválida: " + process.argv[1]);
                }
                console.log(`${parts[0]}.${parts[1]}.${parts[2] + 1}`);
              ' "$CURRENT_VERSION")

              RELEASE_BRANCH="release/v$NEXT_VERSION"
              git switch -c "$RELEASE_BRANCH"
              npm version "$NEXT_VERSION" --no-git-tag-version
              node -e '
                const fs = require("fs");
                const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
                config.expo.version = process.argv[1];
                fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
              ' "$NEXT_VERSION"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app.json package.json package-lock.json
              git commit -m "chore: prepara versão $NEXT_VERSION"
              git push origin "$RELEASE_BRANCH"

              HEAD_BRANCH="$RELEASE_BRANCH"
              PR_TITLE="Preparar versão $NEXT_VERSION para release"
              ;;
            release)
              BASE_BRANCH="main"
              PR_TITLE="Promover release para main"
              ;;
            *)
              BASE_BRANCH="develop"
              PR_TITLE="$HEAD_BRANCH"
              ;;
          esac

          OPEN_PRS=$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_PRS" -eq 0 ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "$PR_TITLE" \
              --body "Pull Request criado automaticamente após a validação do CI."
          else
            echo "Já existe um Pull Request aberto de $HEAD_BRANCH para $BASE_BRANCH."
          fi
